server:
  port: 8080

spring:
  application:
    name: delta-game
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/delta_game?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:delta_game}
    password: ${DB_PASSWORD:change_me}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AES encryption
aes:
  key: ${AES_KEY:change_me_16byte}

# JWT
jwt:
  secret: ${JWT_SECRET:change_me_jwt_secret_at_least_256_bits}
  expiration: 259200000

auth:
  h5:
    login-code: ${AUTH_H5_LOGIN_CODE:change_login_code}

# WeChat Mini Program
wx:
  miniapp:
    enabled: ${WX_MINIAPP_ENABLED:false}
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
    subscribe-template:
      # 订单状态变更通知（模板字段：phrase4/character_string1/thing2/amount3；场景：支付成功、被接单、已取消、已退款、被指派、打手标记完成、仲裁结果）
      order-status: ${WX_ORDER_STATUS_TEMPLATE_ID:}
      # 收入到账通知（覆盖：收入结算到账、提现处理结果）
      income: YOUR_TEMPLATE_ID_INCOME
      # 组队邀请通知（覆盖：队友被邀请）
      team-invite: YOUR_TEMPLATE_ID_TEAM_INVITE
      # 订单确认通知（覆盖：用户确认完成）
      order-confirm: YOUR_TEMPLATE_ID_ORDER_CONFIRM
  pay:
    enabled: ${WX_PAY_ENABLED:false}
    # 商户号
    mch-id: ${WX_PAY_MCH_ID:}
    notify-url: ${WX_PAY_NOTIFY_URL:https://your-domain.example/api/pay/wx/notify}
    # 微信支付V3 API密钥(自己设置的密钥)
    api-v3-key: ${WX_PAY_API_V3_KEY:}
    # 微信支付私钥（你从商户平台下载的私钥文件路径，apiclient_key.pem）
    private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
    # 微信支付证书序列号（商户平台“API 安全”页面展示的证书序列号）
    cert-serial-no: ${WX_PAY_CERT_SERIAL_NO:}
    # 微信支付公钥（你从商户平台下载的公钥文件路径，pub_key.pem）
    public-key-path: ${WX_PAY_PUBLIC_KEY_PATH:}
    # 微信支付公钥ID（商户平台“微信支付公钥”页面展示的ID）
    public-key-id: ${WX_PAY_PUBLIC_KEY_ID:}

# File upload（生产环境，Linux 服务器）
file:
  upload:
    path: /www/data/upload
    url-prefix: ${FILE_UPLOAD_URL_PREFIX:/file/}

# Settlement
delta:
  settlement:
    commission-rate: 0.2

# Logging
logging:
  level:
    com.delta: debug
    org.springframework.security: info

# Knife4j Swagger
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.delta
  paths-to-match: "/**"

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类
